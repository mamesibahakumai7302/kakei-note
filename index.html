<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf8f2">
<title>家計ノート</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background:#fdf8f2; color:#33302b; padding-bottom:84px; }
  header { position:sticky; top:0; background:#fdf8f2; padding:12px 16px 8px; border-bottom:1px solid #eadfce; z-index:5; }
  header h1 { font-size:18px; margin:0 0 8px; }
  .monthbar { display:flex; align-items:center; justify-content:space-between; }
  .monthbar button { font-size:20px; background:#fff; border:1px solid #ddd2bd; border-radius:10px; width:44px; height:38px; }
  .monthbar .m { font-size:17px; font-weight:700; }
  main { padding:12px 16px; max-width:640px; margin:0 auto; }
  .tabs { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #eadfce; display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; background:none; border:none; padding:10px 0 12px; font-size:14px; color:#8a8172; }
  .tabs button.on { color:#b3541e; font-weight:700; }
  .tabs .badge { background:#d64545; color:#fff; border-radius:9px; font-size:11px; padding:1px 6px; margin-left:4px; vertical-align:2px; }
  .card { background:#fff; border:1px solid #eadfce; border-radius:14px; padding:14px; margin-bottom:12px; }
  .tx { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f1e9da; }
  .tx:last-child { border-bottom:none; }
  .tx .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .tx .body { flex:1; min-width:0; }
  .tx .desc { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx .sub { font-size:12px; color:#8a8172; }
  .tx .amt { font-size:16px; font-weight:700; white-space:nowrap; }
  .suggest { font-size:12px; color:#b3541e; background:#fdf0e4; border-radius:8px; padding:2px 8px; display:inline-block; margin-top:3px; }
  .btn { display:block; width:100%; background:#b3541e; color:#fff; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; margin-top:10px; }
  .btn.sub { background:#fff; color:#b3541e; border:1px solid #b3541e; }
  .btn.ghost { background:#f4eee1; color:#5c5546; border:none; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chip { border:1px solid #ddd2bd; background:#fff; border-radius:999px; padding:8px 14px; font-size:14px; }
  .chip.on { background:#33302b; color:#fff; border-color:#33302b; }
  label { font-size:13px; color:#8a8172; display:block; margin:12px 0 4px; }
  input[type=number], input[type=text], input[type=date], input[type=password] { width:100%; font-size:17px; padding:12px; border:1px solid #ddd2bd; border-radius:10px; background:#fff; }
  .donutwrap { display:flex; align-items:center; gap:16px; }
  .donut { width:150px; height:150px; border-radius:50%; flex:none; position:relative; }
  .donut .hole { position:absolute; inset:26px; background:#fff; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut .hole .t { font-size:17px; font-weight:800; }
  .donut .hole .s { font-size:11px; color:#8a8172; }
  .catrow { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f1e9da; }
  .catrow:last-child { border-bottom:none; }
  .catrow .nm { flex:1; font-size:15px; }
  .catrow .am { font-weight:700; }
  .diff { font-size:12px; margin-left:8px; }
  .diff.up { color:#d64545; } .diff.dn { color:#2e9e5b; } .diff.eq { color:#8a8172; }
  .banner { background:#fdecec; border:1px solid #f3b8b8; border-radius:14px; padding:14px; margin-bottom:12px; }
  .banner .ttl { font-weight:800; color:#b02a2a; margin-bottom:4px; }
  .banner .it { font-size:13px; color:#7a3434; }
  .empty { text-align:center; color:#8a8172; padding:28px 0; font-size:15px; }
  .overlay { position:fixed; inset:0; background:rgba(40,35,28,.45); display:none; z-index:20; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); display:none; z-index:21; max-height:88vh; overflow:auto; }
  .overlay.show, .sheet.show { display:block; }
  #gate { position:fixed; inset:0; background:#fdf8f2; z-index:50; display:none; padding:40px 24px; }
  #gate.show { display:block; }
  .msg { font-size:13px; color:#b02a2a; min-height:18px; margin-top:8px; }
  .ok-msg { font-size:13px; color:#2e9e5b; min-height:18px; margin-top:8px; }
  .small { font-size:12px; color:#8a8172; }
  .row2 { display:flex; gap:10px; } .row2 > * { flex:1; }
</style>
</head>
<body>

<div id="gate">
  <h1 style="font-size:22px">家計ノート</h1>
  <p class="small">合言葉を入れてね</p>
  <input type="password" id="gateInput" placeholder="合言葉" autocomplete="current-password">
  <button class="btn" id="gateBtn">ひらく</button>
  <div class="msg" id="gateMsg"></div>
</div>

<header>
  <h1>家計ノート</h1>
  <div class="monthbar">
    <button id="prevM">‹</button>
    <div class="m" id="monthLabel"></div>
    <button id="nextM">›</button>
  </div>
</header>

<main>
  <section id="view-wait"></section>
  <section id="view-sum" style="display:none"></section>
  <section id="view-add" style="display:none">
    <div class="card">
      <label>金額（円）</label>
      <input type="number" id="addAmount" inputmode="numeric" placeholder="0">
      <label>内容（任意）</label>
      <input type="text" id="addDesc" placeholder="例：イオンで買い物">
      <label>日付</label>
      <input type="date" id="addDate">
      <label>分類（選ばなければ確認待ちに入るよ）</label>
      <div class="chips" id="addCats"></div>
      <label>支払い方法</label>
      <div class="chips" id="addPays"></div>
      <button class="btn" id="addBtn">登録する</button>
      <div class="ok-msg" id="addMsg"></div>
    </div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:6px">レシートの写真から追加</div>
      <div class="small">写真を撮ると 金額と日付とお店を読んで 確認待ちに入るよ<br>読み取りが違ったら 確認待ちで直してね</div>
      <input type="file" id="receiptFile" accept="image/*" capture="environment" style="display:none">
      <button class="btn sub" id="receiptBtn">レシートを撮る・選ぶ</button>
      <div class="ok-msg" id="receiptMsg"></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button id="tabWait">確認待ち<span class="badge" id="waitBadge" style="display:none"></span></button>
  <button id="tabSum" class="on">まとめ</button>
  <button id="tabAdd">追加</button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyWigLaDfYDs5ssIC21DDrRWkeUrjWn0eMpS-e1lSz__oeayqjkWSbWiMxTnmKefvHq/exec';
const PAYS = { card:'カード', cash:'現金', paypay:'PayPay', bank:'口座引き落とし', other:'その他' };
const FIXED_NAME = '固定費';
let pass = localStorage.getItem('kakei_pass') || '';
let month = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let state = null;
let view = 'sum';
const CAT_ORDER = ['食料品','外食','日用品','車','固定費','ローン・住居','にこ','はるか','てっぺい','こうめ','その他'];
function sortCats(){
  if (!state || !state.categories) return;
  state.categories.sort((a,b)=>{
    const ia = CAT_ORDER.indexOf(a.name), ib = CAT_ORDER.indexOf(b.name);
    return (ia<0?999:ia) - (ib<0?999:ib) || (a.sortOrder||0) - (b.sortOrder||0);
  });
}

async function api(action, args){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ passcode: pass, action }, args||{})) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.data !== undefined ? j.data : j;
}
function yen(n){ return '¥' + Number(n||0).toLocaleString('ja-JP'); }
function catById(id){ return (state.categories||[]).find(c=>c.id===id); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  state = await api('getState', { month });
  sortCats();
  render();
}
function monthText(m){ const [y,mm]=m.split('-'); return y+'年'+Number(mm)+'月'; }
function shiftMonth(m, d){ const [y,mm]=m.split('-').map(Number); const dt=new Date(y, mm-1+d, 1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }

function suggest(tx){
  const rules = state.rules || [];
  let best = null;
  for (const r of rules){ if (r.description === tx.description) best = r; }
  if (best) return { id: best.categoryId, why:'前もこの分類' };
  for (const r of rules){
    if (r.description && tx.description && (tx.description.startsWith(r.description.slice(0,6)) || r.description.startsWith(tx.description.slice(0,6)))) best = r;
  }
  if (best) return { id: best.categoryId, why:'似たお店の前例' };
  const mf = tx.mfCategory || '';
  const byName = n => (state.categories||[]).find(c=>c.name===n);
  if (mf.indexOf('自動車')===0 && byName('車')) return { id: byName('車').id, why:'種類からの推測' };
  if (mf.indexOf('保険')===0 && byName('固定費')) return { id: byName('固定費').id, why:'種類からの推測' };
  if ((mf.indexOf('水道・光熱費')===0 || mf.indexOf('住宅')===0) && byName('ローン・住居')) return { id: byName('ローン・住居').id, why:'種類からの推測' };
  if (mf.indexOf('食費/外食')===0 && byName('外食')) return { id: byName('外食').id, why:'種類からの推測' };
  return null;
}

function totals(list){
  const m = {};
  for (const t of list) m[t.categoryId] = (m[t.categoryId]||0) + t.amount;
  return m;
}
function diffHtml(cur, prev){
  const d = (cur||0) - (prev||0);
  if (d === 0) return '<span class="diff eq">先月と同じ</span>';
  if (d > 0) return '<span class="diff up">先月比 +' + d.toLocaleString('ja-JP') + '円</span>';
  return '<span class="diff dn">先月比 −' + Math.abs(d).toLocaleString('ja-JP') + '円</span>';
}

function render(){
  document.getElementById('monthLabel').textContent = monthText(month);
  const badge = document.getElementById('waitBadge');
  if (state.waiting.length){ badge.style.display='inline-block'; badge.textContent = state.waiting.length; } else badge.style.display='none';
  document.getElementById('view-wait').style.display = view==='wait' ? '' : 'none';
  document.getElementById('view-sum').style.display = view==='sum' ? '' : 'none';
  document.getElementById('view-add').style.display = view==='add' ? '' : 'none';
  document.getElementById('tabWait').classList.toggle('on', view==='wait');
  document.getElementById('tabSum').classList.toggle('on', view==='sum');
  document.getElementById('tabAdd').classList.toggle('on', view==='add');
  if (view==='wait') renderWait();
  if (view==='sum') renderSum();
}

function txRow(t, opts){
  opts = opts || {};
  const c = t.categoryId ? catById(t.categoryId) : null;
  const color = c ? c.color : '#c9bda3';
  return '<div class="tx" data-id="'+t.id+'">' +
    '<div class="dot" style="background:'+color+'"></div>' +
    '<div class="body"><div class="desc">'+esc(t.description || '(内容なし)')+'</div>' +
    '<div class="sub">'+esc(t.date)+' ・ '+esc(PAYS[t.paymentMethod]||'その他')+(c ? ' ・ '+esc(c.name) : '')+'</div>' +
    (opts.extra || '') + '</div>' +
    '<div class="amt">'+yen(t.amount)+'</div></div>';
}

function renderWait(){
  const el = document.getElementById('view-wait');
  if (!state.waiting.length){
    el.innerHTML = '<div class="card"><div class="empty">確認待ちはないよ<br>ぜんぶ仕訳ずみ</div></div>' +
      '<div class="card"><div style="font-weight:700;margin-bottom:6px">'+monthText(month)+'の明細</div>' +
      (state.monthTransactions.slice().sort((a,b)=>a.date<b.date?1:-1).map(t=>txRow(t)).join('') || '<div class="empty">この月の明細はないよ</div>') + '</div>';
  } else {
    el.innerHTML = '<div class="card"><div style="font-weight:700;margin-bottom:4px">確認待ち '+state.waiting.length+'件</div>' +
      '<div class="small">タップすると分類を選べるよ</div>' +
      state.waiting.slice().sort((a,b)=>a.date<b.date?1:-1).map(t=>{
        const s = suggest(t);
        const extra = s && catById(s.id) ? '<span class="suggest">おすすめ：'+esc(catById(s.id).name)+'（'+esc(s.why)+'）</span>' : '';
        return txRow(t, { extra });
      }).join('') + '</div>';
  }
  el.querySelectorAll('.tx').forEach(n=> n.addEventListener('click', ()=> openEditor(Number(n.dataset.id))));
}

function renderSum(){
  const el = document.getElementById('view-sum');
  const cur = totals(state.monthTransactions), prev = totals(state.prevMonthTransactions);
  const total = state.monthTransactions.reduce((s,t)=>s+t.amount,0);
  const prevTotal = state.prevMonthTransactions.reduce((s,t)=>s+t.amount,0);
  let html = '';
  // 固定費の見直しサイン
  const fixed = (state.categories||[]).find(c=>c.name===FIXED_NAME);
  if (fixed && (cur[fixed.id]||0) > (prev[fixed.id]||0)){
    const byDesc = {};
    for (const t of state.monthTransactions) if (t.categoryId===fixed.id) byDesc[t.description]=(byDesc[t.description]||0)+t.amount;
    const byDescP = {};
    for (const t of state.prevMonthTransactions) if (t.categoryId===fixed.id) byDescP[t.description]=(byDescP[t.description]||0)+t.amount;
    const inc = Object.keys(byDesc).map(d=>({ d, diff:(byDesc[d]||0)-(byDescP[d]||0) })).filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff).slice(0,3);
    html += '<div class="banner"><div class="ttl">固定費が先月より増えてるよ</div>' +
      '<div>今月 '+yen(cur[fixed.id])+' ／ 先月 '+yen(prev[fixed.id])+'（+'+((cur[fixed.id]||0)-(prev[fixed.id]||0)).toLocaleString('ja-JP')+'円）</div>' +
      inc.map(x=>'<div class="it">・'+esc(x.d)+' +'+x.diff.toLocaleString('ja-JP')+'円</div>').join('') + '</div>';
  }
  // ドーナツ
  const cats = (state.categories||[]).filter(c=>cur[c.id]);
  let acc = 0; const parts = [];
  for (const c of cats){ const p = total ? (cur[c.id]/total*100) : 0; parts.push(c.color+' '+acc+'% '+(acc+p)+'%'); acc += p; }
  const donutBg = parts.length ? 'conic-gradient('+parts.join(',')+')' : '#eee';
  html += '<div class="card"><div class="donutwrap"><div class="donut" style="background:'+donutBg+'"><div class="hole"><div class="t">'+yen(total)+'</div><div class="s">'+monthText(month)+'</div></div></div>' +
    '<div style="flex:1"><div style="font-weight:700">合計 '+yen(total)+'</div><div>'+diffHtml(total, prevTotal)+'</div>' +
    '<div class="small" style="margin-top:6px">分類ずみ '+state.monthTransactions.length+'件<br>確認待ち '+state.waiting.length+'件</div></div></div></div>';
  html += '<div class="card">' + (state.categories||[]).map(c=>{
    if (!cur[c.id] && !prev[c.id]) return '';
    return '<div class="catrow" data-cat="'+c.id+'"><div class="dot" style="width:12px;height:12px;border-radius:50%;background:'+c.color+'"></div><div class="nm">'+esc(c.name)+(c.name===FIXED_NAME && (cur[c.id]||0)>(prev[c.id]||0) ? ' <span class="suggest">見直しサイン</span>' : '')+'</div><div class="am">'+yen(cur[c.id]||0)+diffHtml(cur[c.id]||0, prev[c.id]||0)+'</div></div>';
  }).join('') + '</div>';
  html += '<div id="catDetail"></div>';
  html += '<div class="card"><div style="font-weight:700;margin-bottom:6px">設定</div><button class="btn ghost" id="chgPass">合言葉を変える</button></div>';
  el.innerHTML = html;
  el.querySelectorAll('.catrow').forEach(n=> n.addEventListener('click', ()=>{
    const cid = Number(n.dataset.cat);
    const list = state.monthTransactions.filter(t=>t.categoryId===cid).sort((a,b)=>a.date<b.date?1:-1);
    const d = document.getElementById('catDetail');
    d.innerHTML = '<div class="card"><div style="font-weight:700;margin-bottom:4px">'+esc(catById(cid).name)+' の明細（'+list.length+'件）</div>' + (list.map(t=>txRow(t)).join('') || '<div class="empty">ないよ</div>') + '</div>';
    d.querySelectorAll('.tx').forEach(x=> x.addEventListener('click', ()=> openEditor(Number(x.dataset.id))));
    d.scrollIntoView({ behavior:'smooth' });
  }));
  const cp = document.getElementById('chgPass');
  if (cp) cp.addEventListener('click', async ()=>{
    const np = prompt('新しい合言葉を入れてね');
    if (!np) return;
    try { await api('changePasscode', { newPasscode: np }); pass = np; localStorage.setItem('kakei_pass', np); alert('合言葉を変えたよ'); }
    catch(e){ alert('変えられなかったよ もう一度試してね'); }
  });
}

function findTx(id){
  return (state.monthTransactions.concat(state.prevMonthTransactions, state.waiting)).find(t=>t.id===id);
}
let editing = null, editCat = undefined, editPay = undefined;
function openEditor(id){
  const t = findTx(id); if (!t) return;
  editing = t; editCat = t.categoryId; editPay = t.paymentMethod || 'other';
  const s = t.categoryId===null ? suggest(t) : null;
  const sheet = document.getElementById('sheet');
  sheet.innerHTML =
    '<div style="font-weight:800;font-size:17px;margin-bottom:4px">'+esc(t.description || '(内容なし)')+'</div>' +
    '<div class="small">'+esc(t.date)+' ・ '+yen(t.amount)+'</div>' +
    (s && catById(s.id) ? '<button class="btn" id="edSuggest">おすすめの「'+esc(catById(s.id).name)+'」で登録</button>' : '') +
    '<label>分類</label><div class="chips" id="edCats">' +
      (state.categories||[]).map(c=>'<button class="chip'+(editCat===c.id?' on':'')+'" data-c="'+c.id+'"><span style="color:'+c.color+'">●</span> '+esc(c.name)+'</button>').join('') +
      '<button class="chip'+(editCat===null?' on':'')+'" data-c="null">確認待ち</button></div>' +
    '<label>金額（円）</label><input type="number" id="edAmount" inputmode="numeric" value="'+t.amount+'">' +
    '<label>内容</label><input type="text" id="edDesc" value="'+esc(t.description)+'">' +
    '<label>日付</label><input type="date" id="edDate" value="'+esc(t.date)+'">' +
    '<label>支払い方法</label><div class="chips" id="edPays">' +
      Object.keys(PAYS).map(k=>'<button class="chip'+(editPay===k?' on':'')+'" data-p="'+k+'">'+PAYS[k]+'</button>').join('') + '</div>' +
    '<button class="btn" id="edSave">保存する</button>' +
    '<div class="row2"><button class="btn ghost" id="edClose">閉じる</button><button class="btn ghost" id="edDelete">削除する</button></div>' +
    '<div class="msg" id="edMsg"></div>';
  document.getElementById('overlay').classList.add('show');
  sheet.classList.add('show');
  sheet.querySelectorAll('#edCats .chip').forEach(ch=> ch.addEventListener('click', ()=>{ editCat = ch.dataset.c==='null' ? null : Number(ch.dataset.c); sheet.querySelectorAll('#edCats .chip').forEach(x=>x.classList.toggle('on', x===ch)); }));
  sheet.querySelectorAll('#edPays .chip').forEach(ch=> ch.addEventListener('click', ()=>{ editPay = ch.dataset.p; sheet.querySelectorAll('#edPays .chip').forEach(x=>x.classList.toggle('on', x===ch)); }));
  const sg = document.getElementById('edSuggest');
  if (sg) sg.addEventListener('click', async ()=>{ try { await api('classify', { id: t.id, categoryId: s.id }); closeEditor(); await load(); } catch(e){ document.getElementById('edMsg').textContent = '登録できなかったよ'; } });
  document.getElementById('edSave').addEventListener('click', async ()=>{
    try {
      await api('updateTransaction', { id: t.id, date: document.getElementById('edDate').value, description: document.getElementById('edDesc').value, amount: Number(document.getElementById('edAmount').value||0), paymentMethod: editPay, categoryId: editCat });
      closeEditor(); await load();
    } catch(e){ document.getElementById('edMsg').textContent = '保存できなかったよ'; }
  });
  document.getElementById('edDelete').addEventListener('click', async ()=>{
    if (!confirm('この明細を消す？')) return;
    try { await api('deleteTransaction', { id: t.id }); closeEditor(); await load(); } catch(e){ document.getElementById('edMsg').textContent = '消せなかったよ'; }
  });
  document.getElementById('edClose').addEventListener('click', closeEditor);
}
function closeEditor(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('sheet').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', closeEditor);

// 追加フォーム
let addCat = null, addPay = 'cash';
function renderAddChips(){
  document.getElementById('addCats').innerHTML = (state ? state.categories : []).map(c=>'<button class="chip'+(addCat===c.id?' on':'')+'" data-c="'+c.id+'"><span style="color:'+c.color+'">●</span> '+esc(c.name)+'</button>').join('');
  document.querySelectorAll('#addCats .chip').forEach(ch=> ch.addEventListener('click', ()=>{ const id = Number(ch.dataset.c); addCat = (addCat===id ? null : id); renderAddChips(); }));
  document.getElementById('addPays').innerHTML = Object.keys(PAYS).map(k=>'<button class="chip'+(addPay===k?' on':'')+'" data-p="'+k+'">'+PAYS[k]+'</button>').join('');
  document.querySelectorAll('#addPays .chip').forEach(ch=> ch.addEventListener('click', ()=>{ addPay = ch.dataset.p; renderAddChips(); }));
}
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const amount = Number(document.getElementById('addAmount').value||0);
  const msg = document.getElementById('addMsg');
  if (!amount){ msg.textContent = ''; document.getElementById('addMsg').textContent=''; alert('金額を入れてね'); return; }
  try {
    await api('addTransaction', { date: document.getElementById('addDate').value, description: document.getElementById('addDesc').value, amount, paymentMethod: addPay, categoryId: addCat });
    document.getElementById('addAmount').value=''; document.getElementById('addDesc').value='';
    msg.textContent = '登録したよ';
    await load();
  } catch(e){ alert('登録できなかったよ'); }
});
document.getElementById('receiptBtn').addEventListener('click', ()=> document.getElementById('receiptFile').click());
document.getElementById('receiptFile').addEventListener('change', async (ev)=>{
  const f = ev.target.files[0]; if (!f) return;
  const msg = document.getElementById('receiptMsg'); msg.textContent = '読み取り中…';
  try {
    const img = await createImageBitmap(f);
    const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const dataUrl = cv.toDataURL('image/jpeg', 0.85);
    const b64 = dataUrl.split(',')[1];
    const r = await api('readReceipt', { imageBase64: b64, mimeType: 'image/jpeg' });
    msg.textContent = '確認待ちに入れたよ（' + (r.extracted ? esc(r.extracted.description) + ' ' + yen(r.extracted.amount) : '') + '）';
    await load();
  } catch(e){ msg.textContent = '読み取れなかったよ 写真を選び直してね'; }
  ev.target.value = '';
});

// タブ・月移動
function setView(v){ view = v; render(); window.scrollTo(0,0); }
document.getElementById('tabWait').addEventListener('click', ()=> setView('wait'));
document.getElementById('tabSum').addEventListener('click', ()=> setView('sum'));
document.getElementById('tabAdd').addEventListener('click', ()=> setView('add'));
document.getElementById('prevM').addEventListener('click', async ()=>{ month = shiftMonth(month,-1); await load(); });
document.getElementById('nextM').addEventListener('click', async ()=>{ month = shiftMonth(month, 1); await load(); });

// 合言葉ゲート
async function tryOpen(){
  try { state = await api('getState', { month }); sortCats(); document.getElementById('gate').classList.remove('show'); renderAddChips(); render(); return true; }
  catch(e){ return false; }
}
document.getElementById('gateBtn').addEventListener('click', async ()=>{
  pass = document.getElementById('gateInput').value.trim();
  if (!pass) return;
  const ok = await tryOpen();
  if (ok){ localStorage.setItem('kakei_pass', pass); }
  else document.getElementById('gateMsg').textContent = '合言葉が違うみたい';
});
(async ()=>{
  document.getElementById('addDate').value = new Date().toLocaleDateString('sv-SE', { timeZone:'Asia/Tokyo' });
  if (pass && await tryOpen()) return;
  document.getElementById('gate').classList.add('show');
})();
</script>
